[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpgauge"
version = "0.1.0"
description = "A deterministic, offline quality grader for MCP (Model Context Protocol) servers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Michael Tierney" }]
keywords = ["mcp", "model-context-protocol", "quality", "lint", "agents", "llm", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
mcpgauge = "mcpgauge.cli:main"

[project.urls]
Homepage = "https://github.com/Michael-WhiteCapData/mcpgauge"
Issues = "https://github.com/Michael-WhiteCapData/mcpgauge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpgauge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
